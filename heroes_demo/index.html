<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heroes HTML5 Demo</title>
    <style>
        :root {
            --cell-size: 60px;
            --player-color: #4CAF50;
            --enemy-color: #F44336;
            --bg-color: #2b2b2b;
            --text-color: #f0f0f0;
            --highlight-move: rgba(76, 175, 80, 0.4);
            --highlight-attack: rgba(244, 67, 54, 0.4);
            --border-color: #444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #game-container {
            max-width: 800px;
            width: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        header {
            text-align: center;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
        }

        #turn-indicator {
            font-weight: bold;
            color: #ffd700;
        }

        /* Battle Grid */
        #battlefield {
            display: grid;
            /* 8 columns by default */
            grid-template-columns: repeat(8, 1fr); 
            gap: 2px;
            background-color: #1a1a1a;
            padding: 5px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            aspect-ratio: 8/6; /* Keep aspect ratio roughly consistent */
            position: relative;
            user-select: none;
        }

        .cell {
            background-color: #333;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }

        .cell:hover {
            background-color: #3d3d3d;
        }

        .cell.highlight-move {
            background-color: var(--highlight-move);
            box-shadow: inset 0 0 10px var(--player-color);
        }

        .cell.highlight-attack {
            background-color: var(--highlight-attack);
            box-shadow: inset 0 0 10px var(--enemy-color);
        }

        /* Units */
        .unit {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            position: relative;
            border: 2px solid transparent;
            transition: transform 0.2s;
            z-index: 10;
        }

        .unit.player {
            border-color: var(--player-color);
            background: rgba(76, 175, 80, 0.2);
        }

        .unit.enemy {
            border-color: var(--enemy-color);
            background: rgba(244, 67, 54, 0.2);
        }

        .unit.active {
            box-shadow: 0 0 15px #ffd700;
            transform: scale(1.1);
            z-index: 20;
            border-color: #ffd700;
        }

        .unit.dead {
            opacity: 0.3;
            filter: grayscale(100%);
            transform: scale(0.8);
        }

        /* HP Bar */
        .hp-bar-bg {
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 4px;
            background: #000;
            border-radius: 2px;
        }

        .hp-bar-fill {
            height: 100%;
            background: #0f0;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .unit.enemy .hp-bar-fill {
            background: #f00;
        }

        /* Floating Text */
        .floating-text {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; top: -20px; }
            100% { opacity: 0; top: -50px; }
        }

        /* UI Panel */
        #ui-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        h3 {
            margin-top: 0;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }

        #unit-info, #combat-log {
            padding: 5px;
        }

        #actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-top: 10px;
        }

        button {
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #555;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #combat-log {
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.9rem;
            font-family: monospace;
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid #444;
            padding-bottom: 2px;
        }

        /* Modal */
        .modal-content {
            background: #333;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #ffd700;
        }

        #game-over-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 600px) {
            #battlefield {
                /* On small screens, maybe fewer columns or smaller font */
                gap: 1px;
            }
            
            .unit {
                font-size: 1.2rem;
            }
            
            #ui-panel {
                grid-template-columns: 1fr; /* Stack panels */
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Heroes Battle Demo</h1>
            <div id="turn-indicator">Ход игрока</div>
        </header>

        <div id="battlefield">
            <!-- Grid will be generated here -->
        </div>

        <div id="ui-panel">
            <div id="unit-info">
                <h3>Информация</h3>
                <div id="selected-unit-stats">Выберите юнита</div>
                <div id="actions">
                    <button id="btn-defend" title="+2 Защиты до след. хода">🛡️ Защита</button>
                    <button id="btn-wait" title="Пропустить ход">⏳ Ждать</button>
                </div>
            </div>
            <div id="combat-log">
                <h3>Журнал боя</h3>
                <div id="log-content"></div>
            </div>
        </div>
        
        <div id="game-over-modal" class="hidden">
            <div class="modal-content">
                <h2 id="game-over-message"></h2>
                <button onclick="location.reload()">Играть снова</button>
            </div>
        </div>
    </div>

    <script>
        // Game Configuration
        const COLS = 8;
        const ROWS = 6;

        // Unit Types
        const UNIT_TYPES = {
            knight: { name: 'Рыцарь', icon: '🛡️', hp: 50, dmg: 8, def: 3, range: 1, speed: 4, type: 'melee' },
            archer: { name: 'Лучник', icon: '🏹', hp: 30, dmg: 6, def: 1, range: 5, speed: 6, type: 'ranged' },
            mage:   { name: 'Маг', icon: '🧙‍♂️', hp: 25, dmg: 10, def: 0, range: 4, speed: 5, type: 'magic' },
            
            orc:    { name: 'Орк', icon: '👺', hp: 60, dmg: 10, def: 2, range: 1, speed: 3, type: 'melee' },
            goblin: { name: 'Гоблин', icon: '👹', hp: 20, dmg: 5, def: 0, range: 1, speed: 7, type: 'melee' },
            skeleton: { name: 'Скелет', icon: '💀', hp: 35, dmg: 7, def: 1, range: 4, speed: 4, type: 'ranged' }
        };

        // Game State
        let grid = [];
        let units = [];
        let currentTurnIndex = 0;
        let turnQueue = [];
        let selectedUnit = null;
        let gameActive = true;
        let isPlayerTurn = false;

        // Initialize Game
        function initGame() {
            createGrid();
            spawnUnits();
            startBattle();
        }

        function createGrid() {
            const battlefield = document.getElementById('battlefield');
            battlefield.innerHTML = '';
            grid = [];
            
            for (let y = 0; y < ROWS; y++) {
                const row = [];
                for (let x = 0; x < COLS; x++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    cell.addEventListener('click', () => handleCellClick(x, y));
                    battlefield.appendChild(cell);
                    row.push(cell);
                }
                grid.push(row);
            }
        }

        function spawnUnits() {
            units = [];
            // Player Units (Left side)
            createUnit('knight', 1, 1, 'player');
            createUnit('archer', 0, 2, 'player');
            createUnit('mage', 1, 3, 'player');

            // Enemy Units (Right side)
            createUnit('orc', 6, 1, 'enemy');
            createUnit('goblin', 7, 2, 'enemy');
            createUnit('skeleton', 6, 3, 'enemy');

            units.forEach(u => u.currentHp = u.stats.hp);
            sortTurnQueue();
        }

        function createUnit(typeKey, x, y, team) {
            const stats = UNIT_TYPES[typeKey];
            const unit = {
                id: Math.random().toString(36).substr(2, 9),
                type: typeKey,
                stats: { ...stats },
                x: x,
                y: y,
                team: team,
                currentHp: stats.hp,
                isDefending: false,
                isDead: false
            };
            units.push(unit);
            renderUnit(unit);
            return unit;
        }

        function renderUnit(unit) {
            if (unit.isDead) return;
            
            const cell = grid[unit.y][unit.x];
            let el = document.getElementById(unit.id);
            
            if (!el) {
                el = document.createElement('div');
                el.id = unit.id;
                el.classList.add('unit', unit.team);
                el.textContent = unit.stats.icon;
                
                const barBg = document.createElement('div');
                barBg.className = 'hp-bar-bg';
                const barFill = document.createElement('div');
                barFill.className = 'hp-bar-fill';
                barBg.appendChild(barFill);
                el.appendChild(barBg);
                
                cell.appendChild(el);
            } else {
                if (el.parentElement !== cell) {
                    cell.appendChild(el);
                }
            }

            // Visual feedback for Defending
            if (unit.isDefending) {
                el.style.border = '2px solid blue';
            } else {
                el.style.border = ''; // Reset to class default
            }

            const hpPercent = Math.max(0, (unit.currentHp / unit.stats.hp) * 100);
            const barFill = el.querySelector('.hp-bar-fill');
            barFill.style.width = hpPercent + '%';
        }

        function sortTurnQueue() {
            turnQueue = units.filter(u => !u.isDead).sort((a, b) => b.stats.speed - a.stats.speed);
        }

        function startBattle() {
            currentTurnIndex = -1;
            nextTurn();
        }

        function nextTurn() {
            if (!gameActive) return;
            
            const aliveTeams = new Set(units.filter(u => !u.isDead).map(u => u.team));
            if (!aliveTeams.has('player')) {
                endGame(false);
                return;
            }
            if (!aliveTeams.has('enemy')) {
                endGame(true);
                return;
            }

            currentTurnIndex = (currentTurnIndex + 1) % turnQueue.length;
            turnQueue = turnQueue.filter(u => !u.isDead);
            
            // Safety check if queue is empty
            if (turnQueue.length === 0) return;

            if (currentTurnIndex >= turnQueue.length) currentTurnIndex = 0;

            const currentUnit = turnQueue[currentTurnIndex];
            selectedUnit = currentUnit;
            
            // Reset temporary states
            currentUnit.isDefending = false;
            currentUnit.hasMoved = false;
            currentUnit.hasActed = false;
            renderUnit(currentUnit); // Update visuals (remove shield border)

            updateUI();
            highlightActiveUnit(currentUnit);

            isPlayerTurn = (currentUnit.team === 'player');
            const indicator = document.getElementById('turn-indicator');
            indicator.textContent = isPlayerTurn ? 
                `Ход: ${currentUnit.stats.name} (Вы)` : 
                `Ход: ${currentUnit.stats.name} (ИИ)`;
            indicator.style.color = isPlayerTurn ? '#4CAF50' : '#F44336';

            clearHighlights();

            if (!isPlayerTurn) {
                setTimeout(aiExecuteTurn, 1000);
            } else {
                showMovementRange(currentUnit);
            }
        }

        function highlightActiveUnit(unit) {
            document.querySelectorAll('.unit').forEach(el => el.classList.remove('active'));
            const el = document.getElementById(unit.id);
            if (el) el.classList.add('active');
        }

        function updateUI() {
            const statsDiv = document.getElementById('selected-unit-stats');
            const btnWait = document.getElementById('btn-wait');
            const btnDefend = document.getElementById('btn-defend');

            if (selectedUnit) {
                statsDiv.innerHTML = `
                    <strong>${selectedUnit.stats.name}</strong><br>
                    HP: ${selectedUnit.currentHp}/${selectedUnit.stats.hp}<br>
                    ⚔️ ${selectedUnit.stats.dmg} | 🛡️ ${selectedUnit.stats.def}<br>
                    👟 ${selectedUnit.stats.speed}
                `;
                
                btnWait.disabled = !isPlayerTurn;
                btnDefend.disabled = !isPlayerTurn;
            }
        }

        function handleCellClick(x, y) {
            if (!isPlayerTurn || !selectedUnit) return;
            if (selectedUnit.hasActed) return; // Cannot act twice

            const targetUnit = getUnitAt(x, y);

            // Attack
            if (targetUnit && targetUnit.team !== selectedUnit.team) {
                if (isInRange(selectedUnit, targetUnit)) {
                    performAttack(selectedUnit, targetUnit);
                } else {
                    // Can't move and attack in same click unless we implement move-then-attack logic
                    // For now: Move only if empty.
                    log("Нужно подойти ближе!");
                }
                return;
            }

            // Move
            if (!targetUnit) {
                if (!selectedUnit.hasMoved) {
                    const dist = getDist(selectedUnit.x, selectedUnit.y, x, y);
                    if (dist <= selectedUnit.stats.speed) {
                        moveUnit(selectedUnit, x, y);
                    }
                }
            }
        }

        function moveUnit(unit, x, y) {
            unit.x = x;
            unit.y = y;
            unit.hasMoved = true;
            renderUnit(unit);
            clearHighlights();
            
            // After move, show attack range
            showAttackRange(unit);
        }

        function performAttack(attacker, defender) {
            let def = defender.stats.def;
            if (defender.isDefending) def += 2; // Defend bonus

            let damage = attacker.stats.dmg - def;
            // Variance
            damage = Math.max(1, damage + Math.floor(Math.random() * 3) - 1);

            defender.currentHp -= damage;
            showFloatingText(`-${damage}`, defender.x, defender.y, '#ff0000');
            log(`${attacker.stats.name} атакует ${defender.stats.name} на ${damage} урона.`);

            renderUnit(defender);

            if (defender.currentHp <= 0) {
                killUnit(defender);
            }

            attacker.hasActed = true;
            attacker.hasMoved = true; 
            
            setTimeout(nextTurn, 800);
        }

        function killUnit(unit) {
            unit.isDead = true;
            const el = document.getElementById(unit.id);
            if (el) {
                el.classList.add('dead');
                el.style.border = 'none';
            }
            log(`${unit.stats.name} погиб!`);
        }

        function getDist(x1, y1, x2, y2) {
            return Math.abs(x1 - x2) + Math.abs(y1 - y2);
        }

        function isInRange(attacker, target) {
            return getDist(attacker.x, attacker.y, target.x, target.y) <= attacker.stats.range;
        }

        function getUnitAt(x, y) {
            return units.find(u => !u.isDead && u.x === x && u.y === y);
        }

        function showMovementRange(unit) {
            clearHighlights();
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const dist = getDist(unit.x, unit.y, x, y);
                    if (dist <= unit.stats.speed && !getUnitAt(x, y)) {
                        grid[y][x].classList.add('highlight-move');
                    }
                }
            }
            showAttackRange(unit);
        }

        function showAttackRange(unit) {
            for (let u of units) {
                if (!u.isDead && u.team !== unit.team && isInRange(unit, u)) {
                     grid[u.y][u.x].classList.add('highlight-attack');
        }
            }
        }

        function clearHighlights() {
            document.querySelectorAll('.cell').forEach(c => {
                c.classList.remove('highlight-move');
                c.classList.remove('highlight-attack');
            });
        }

        function showFloatingText(text, x, y, color) {
            const cell = grid[y][x];
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.color = color;
            cell.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function log(msg) {
            const div = document.getElementById('log-content');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = msg;
            div.prepend(entry);
        }

        // AI Logic
        function aiExecuteTurn() {
            if (!selectedUnit || selectedUnit.isDead) {
                nextTurn();
                return;
            }

            const targets = units.filter(u => u.team === 'player' && !u.isDead);
            if (targets.length === 0) {
                nextTurn();
                return;
            }

            let bestTarget = null;
            let minDist = Infinity;

            // Find closest target
            targets.forEach(t => {
                const dist = getDist(selectedUnit.x, selectedUnit.y, t.x, t.y);
                if (dist < minDist) {
                    minDist = dist;
                    bestTarget = t;
                }
            });

            if (!bestTarget) { nextTurn(); return; }

            if (isInRange(selectedUnit, bestTarget)) {
                performAttack(selectedUnit, bestTarget);
            } else {
                // Move towards logic
                let newX = selectedUnit.x;
                let newY = selectedUnit.y;
                let moves = selectedUnit.stats.speed;
                
                // Simple approach step by step
                while (moves > 0) {
                    // Determine best direction
                    let dx = 0, dy = 0;
                    if (newX < bestTarget.x) dx = 1;
                    else if (newX > bestTarget.x) dx = -1;
                    
                    if (newY < bestTarget.y) dy = 1;
                    else if (newY > bestTarget.y) dy = -1;

                    // Prioritize axis with larger delta
                    if (Math.abs(bestTarget.x - newX) > Math.abs(bestTarget.y - newY)) {
                        // Move X first
                        dy = 0;
                    } else {
                        dx = 0;
                    }
                    
                    // If aligned on primary axis, try secondary
                    if (dx === 0 && dy === 0) break; 
                    
                    if (!getUnitAt(newX + dx, newY + dy)) {
                        newX += dx;
                        newY += dy;
                        moves--;
                    } else {
                        // Blocked? Try other axis
                        if (dx !== 0) { dx = 0; dy = (newY < bestTarget.y ? 1 : -1); }
                        else { dy = 0; dx = (newX < bestTarget.x ? 1 : -1); }

                        if (!getUnitAt(newX + dx, newY + dy)) {
                            newX += dx;
                            newY += dy;
                            moves--;
                        } else {
                            break; // Blocked completely
                        }
                    }
                    // Check if reached range during movement (for ranged units)
                    // But we simplify: move full speed then attack
                }

                if (newX !== selectedUnit.x || newY !== selectedUnit.y) {
                     moveUnit(selectedUnit, newX, newY);
                     // Try attack after move
                     if (isInRange(selectedUnit, bestTarget)) {
                         setTimeout(() => performAttack(selectedUnit, bestTarget), 500);
                     } else {
                         setTimeout(nextTurn, 500);
                     }
                } else {
                    // Cannot move closer? Defend?
                    selectedUnit.isDefending = true;
                    log(`${selectedUnit.stats.name} защищается.`);
                    renderUnit(selectedUnit);
                    setTimeout(nextTurn, 500);
                }
            }
        }

        function endGame(playerWon) {
            gameActive = false;
            const modal = document.getElementById('game-over-modal');
            const msg = document.getElementById('game-over-message');
            modal.classList.remove('hidden');
            msg.textContent = playerWon ? "ПОБЕДА!" : "ПОРАЖЕНИЕ!";
            msg.style.color = playerWon ? "#4CAF50" : "#F44336";
        }

        // Bind Actions
        document.getElementById('btn-wait').addEventListener('click', () => {
            if (isPlayerTurn) {
                log(`${selectedUnit.stats.name} пропускает ход.`);
                nextTurn();
            }
        });

        document.getElementById('btn-defend').addEventListener('click', () => {
            if (isPlayerTurn) {
                selectedUnit.isDefending = true;
                log(`${selectedUnit.stats.name} встает в защитную стойку.`);
                renderUnit(selectedUnit);
                nextTurn();
            }
        });

        // Start
        initGame();
    </script>
</body>
</html>
